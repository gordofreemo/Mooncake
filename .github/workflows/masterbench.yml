name: masterbench-image

on:
  push:
    branches: [masterbench]
    paths:
      - "masterbench/**"
      - "mooncake-store/benchmarks/master_bench.cpp"
      - "mooncake-store/src/master_service.cpp"
      - "mooncake-store/include/allocation_strategy.h"
      - ".github/workflows/masterbench.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: masterbench/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mooncake-masterbench:latest
            ghcr.io/${{ github.repository_owner }}/mooncake-masterbench:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Mooncake master metadata benchmark (master_bench, patched)
